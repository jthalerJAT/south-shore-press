name: Export Press PDF

# One-click press export, run from the browser:
#   GitHub → Actions → "Export Press PDF" → Run workflow.
# Renders the live /print/issue, applies the K-only-black pre-pass, and converts
# to PDF/X-1a CMYK with Ghostscript. The result is uploaded as a downloadable
# artifact (issue-x1a.pdf). No local tools needed.
#
# Requires one repo secret:  PRINT_API_TOKEN  (same value as the Vercel env).
# The legacy INDESIGN_API_TOKEN secret is still accepted as a fallback.
# Settings → Secrets and variables → Actions → New repository secret.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Page numbers to export (e.g. "1,2"). Leave blank for the whole issue.'
        required: false
        default: ''

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Ubuntu's packaged Ghostscript (10.02) SEGFAULTS converting the rendered
      # issue to PDF/X-1a; 10.07.1 handles it (verified on the same input).
      # Build 10.07.1 from the official tarball once and cache the install —
      # later runs restore it in seconds.
      - name: Cache Ghostscript 10.07.1
        id: gs-cache
        uses: actions/cache@v4
        with:
          path: ~/gs-install
          key: ghostscript-10.07.1-${{ runner.os }}

      - name: Build Ghostscript 10.07.1
        if: steps.gs-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o gs.tar.gz https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10071/ghostscript-10.07.1.tar.gz
          tar xzf gs.tar.gz
          cd ghostscript-10.07.1
          ./configure --prefix="$HOME/gs-install" --without-x --disable-cups --disable-gtk
          make -j"$(nproc)" && make install

      - name: Use built Ghostscript
        run: echo "GS=$HOME/gs-install/bin/gs" >> "$GITHUB_ENV"

      - name: Install Playwright + Chromium
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Export PDF/X-1a
        env:
          PRINT_API_TOKEN: ${{ secrets.PRINT_API_TOKEN }}
          INDESIGN_API_TOKEN: ${{ secrets.INDESIGN_API_TOKEN }}
          PAGES: ${{ github.event.inputs.pages }}
          OPEN: '0' # never try to open a viewer in CI
        run: node scripts/export-issue-pdf.mjs

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: press-pdf
          path: |
            out/issue-x1a.pdf
            out/issue-rgb.pdf
          if-no-files-found: error
