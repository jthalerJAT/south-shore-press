<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        margin: 0;
        padding: 12px;
        color: #e6e6e6;
      }
      h2 { font-size: 13px; margin: 0 0 8px; }
      label { display: block; margin: 8px 0 2px; font-weight: 600; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 6px;
        font-size: 12px;
      }
      .row { display: flex; gap: 6px; margin-top: 10px; }
      button {
        flex: 1;
        padding: 7px 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #build { background: #c8102e; color: #fff; border: none; }
      #log {
        margin-top: 10px;
        height: 150px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 11px;
        background: #1f1f1f;
        padding: 6px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h2>South Shore Press — Page Builder</h2>

    <label for="base">Portal URL</label>
    <input id="base" type="text" value="https://www.southshorepress.com" />

    <label for="token">API token</label>
    <input id="token" type="password" placeholder="INDESIGN_API_TOKEN" />

    <label for="page">Page</label>
    <select id="page"><option value="">— load the issue first —</option></select>

    <div class="row">
      <button id="load" type="button">Load issue</button>
      <button id="build" type="button">Build page</button>
    </div>

    <div id="log"></div>

    <script src="lib/build-from-spec.js"></script>
    <script src="main.js"></script>
  </body>
</html>
